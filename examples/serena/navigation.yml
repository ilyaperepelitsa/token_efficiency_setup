description: Scoped symbol navigation alongside native coding tools
prompt: |-
  Use scoped symbol overviews, definitions and references before broad source
  reads. Activate the actual worktree and verify one relevant call. Native tools
  remain available for known ranges, strings, logs and configuration. Expand
  scope for real dependencies and verify absence when indexing is incomplete.
  Follow the project's existing ownership, permissions and acceptance checks.
  No model routing or additional planning workflow is required.
excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - replace_content
  - find_file
  - list_dir
single_project: false
tool_description_overrides: {}
